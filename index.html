<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- ✅ CAMBIO AQUI: maximum-scale=1.0 y user-scalable=no desactivan el zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia Snake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        body {
            font-family: 'Courier New', monospace;
            background: #373e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* Evita el zoom por doble toque en algunos navegadores móviles */
            touch-action: manipulation; 
        }

        .nokia-container {
            position: relative;
            width: 360px;
            height: 720px;
            transform-origin: center center;
        }

        .game-layer {
            position: absolute;
            top: 201px;
            left: 58px;
            width: 240px;
            height: 182px;
            z-index: 1;
            background: #9ead86;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            background: #9ead86;
        }

        .skin-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('nokia-skin.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 2;
            pointer-events: none;
        }

        .key-button {
            position: absolute;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0;
            z-index: 10;
            transition: opacity 0.1s;
            /* Evita el zoom por doble toque en los botones */
            touch-action: manipulation;
        }

        .key-button:hover, .key-button:active {
            opacity: 0.2;
            background: #fff;
            border-radius: 50%;
        }

        .key-c { top: 418px; left: 78px; width: 45px; height: 35px; }
        .key-center { top: 394px; left: 138px; width: 80px; height: 35px; }
        .key-2 { top: 498px; left: 148px; width: 60px; height: 36px; }
        .key-4 { top: 535px; left: 65px; width: 60px; height: 39px; }
        .key-6 { top: 534px; left: 232px; width: 60px; height: 41px; }
        .key-8 { top: 597px; left: 148px; width: 62px; height: 35px; }

        .overlay-screen {
            position: absolute;
            top: 20px; left: 20px;
            width: 200px; height: 142px;
            background: #9ead86;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5px;
            text-align: center;
            z-index: 20;
        }

        .overlay-screen h1 { font-size: 13px; margin-bottom: 4px; color: #2d3a1f; }
        .overlay-screen h2 { font-size: 11px; margin-bottom: 4px; color: #2d3a1f; }
        .overlay-screen p { font-size: 8px; margin: 2px 0; color: #2d3a1f; line-height: 1.2; }

        .btn {
            background: #2d3a1f;
            color: #9ead86;
            border: 1px solid #2d3a1f;
            padding: 4px 8px;
            margin: 2px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 9px;
            transition: all 0.2s;
            z-index: 30;
            touch-action: manipulation;
        }

        .btn:hover { background: #9ead86; color: #2d3a1f; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="nokia-container" id="nokiaContainer">
        <div class="game-layer">
            <canvas id="gameCanvas" width="200" height="142"></canvas>

            <div id="menuScreen" class="overlay-screen">
                <h1>&#x1F40D; SNAKE</h1>
                <p>&#xA1;Come todas las caritas!</p>
                <p>&#x1F600;+10 &#x1F601;+15 &#x1F60D;+20<br>&#x1F929;+25 &#x1F973;+30 &#x1F608;+5<br>&#x1F911;+50 &#x1F92A;+40</p>
                <button class="btn" onclick="startGame()">&#x25B6; Jugar</button>
                <button class="btn" onclick="showRanking()">&#x1F3C6; Ranking</button>
            </div>

            <div id="gameOverScreen" class="overlay-screen hidden">
                <h2>&#x1F4A5; &#xA1;Game Over!</h2>
                <p>Puntos: <span id="finalScore">0</span></p>
                <p>&#x1F40D; Long: <span id="finalLength">0</span></p>
                <p>&#x1F34E; Comida: <span id="finalFood">0</span></p>
                <button class="btn" onclick="startGame()">&#x1F504; Otra Vez</button>
                <button class="btn" onclick="showMenu()">&#x1F3E0; Men&#xFA;</button>
                <button class="btn" onclick="shareScore()">&#x1F4E4; Compartir</button>
            </div>

            <div id="rankingScreen" class="overlay-screen hidden">
                <h2>&#x1F3C6; Top Serpientes</h2>
                <div id="rankingList" style="margin: 5px 0; font-size: 8px; max-height: 60px; overflow-y: auto;"></div>
                <button class="btn" onclick="showMenu()">Cerrar</button>
            </div>
        </div>

        <div class="skin-overlay"></div>

        <button class="key-button key-c" onclick="handleKey('c')" title="Men&#xFA; (C)"></button>
        <button class="key-button key-center" onclick="handleKey('5')" title="Start/Pausa"></button>
        <button class="key-button key-2" onclick="handleKey('2')" title="Arriba"></button>
        <button class="key-button key-4" onclick="handleKey('4')" title="Izquierda"></button>
        <button class="key-button key-6" onclick="handleKey('6')" title="Derecha"></button>
        <button class="key-button key-8" onclick="handleKey('8')" title="Abajo"></button>
    </div>

    <script>
        function scaleNokia() {
            const container = document.getElementById('nokiaContainer');
            const baseHeight = 720;
            const availableHeight = window.innerHeight;
            const scale = availableHeight / baseHeight;
            container.style.transform = `scale(${scale})`;
        }
        window.addEventListener('load', scaleNokia);
        window.addEventListener('resize', scaleNokia);

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'eat') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'ui') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 8;
        const tileCountX = Math.floor(canvas.width / gridSize);
        const tileCountY = Math.floor(canvas.height / gridSize);

        let snake = [], food = {}, dx = 0, dy = 0, score = 0, gameLoop = null, gameSpeed = 150, foodEaten = 0;

        const foodTypes = [
            { emoji: '\uD83D\uDE00', points: 10, probability: 0.40 },
            { emoji: '\uD83D\uDE01', points: 15, probability: 0.20 },
            { emoji: '\uD83D\uDE0D', points: 20, probability: 0.15 },
            { emoji: '\uD83E\uDD29', points: 25, probability: 0.10 },
            { emoji: '\uD83E\uDD73', points: 30, probability: 0.05 },
            { emoji: '\uD83D\uDE08', points: 5, probability: 0.05 },
            { emoji: '\uD83E\uDD11', points: 50, probability: 0.03 },
            { emoji: '\uD83E\uDD2A', points: 40, probability: 0.02 }
        ];

        function getRandomFoodType() {
            const random = Math.random(); let cumulative = 0;
            for (let type of foodTypes) { cumulative += type.probability; if (random <= cumulative) return type; }
            return foodTypes[0];
        }

        function initGame() {
            snake = [{ x: Math.floor(tileCountX / 2), y: Math.floor(tileCountY / 2) }, { x: Math.floor(tileCountX / 2) - 1, y: Math.floor(tileCountY / 2) }, { x: Math.floor(tileCountX / 2) - 2, y: Math.floor(tileCountY / 2) }];
            dx = 1; dy = 0; score = 0; foodEaten = 0; updateScore(); placeFood();
        }

        function placeFood() {
            const foodType = getRandomFoodType(); let newFood; let onSnake = true;
            while (onSnake) {
                newFood = { x: Math.floor(Math.random() * tileCountX), y: Math.floor(Math.random() * tileCountY), ...foodType };
                onSnake = snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
            }
            food = newFood;
        }

        function drawGame() {
            ctx.fillStyle = '#9ead86'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#2d3a1f';
            for (let segment of snake) ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
            ctx.font = '7px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(food.emoji, food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2 + 1);
        }

        function updateGame() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            if (head.x < 0) head.x = tileCountX - 1;
            else if (head.x >= tileCountX) head.x = 0;
            if (head.y < 0) head.y = tileCountY - 1;
            else if (head.y >= tileCountY) head.y = 0;

            if (snake.some(segment => head.x === segment.x && head.y === segment.y)) return gameOver();
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += food.points; foodEaten++; if (score < 0) score = 0; updateScore(); placeFood();
                playSound('eat');
                if (score > 0 && score % 50 === 0 && gameSpeed > 60) { gameSpeed -= 10; clearInterval(gameLoop); gameLoop = setInterval(gameStep, gameSpeed); }
            } else { snake.pop(); }
            drawGame();
        }

        function gameStep() { updateGame(); }

        function startGame() {
            playSound('ui');
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('rankingScreen').classList.add('hidden');
            gameSpeed = 150; initGame(); drawGame();
            if (gameLoop) clearInterval(gameLoop); gameLoop = setInterval(gameStep, gameSpeed);
        }

        function gameOver() {
            playSound('die');
            clearInterval(gameLoop); gameLoop = null;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLength').textContent = snake.length;
            document.getElementById('finalFood').textContent = foodEaten;
            document.getElementById('gameOverScreen').classList.remove('hidden'); saveScore(score);
        }

        function showMenu() {
            playSound('ui');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('rankingScreen').classList.add('hidden');
            document.getElementById('menuScreen').classList.remove('hidden');
            if (gameLoop) { clearInterval(gameLoop); gameLoop = null; } drawGame();
        }

        function showRanking() {
            playSound('ui');
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('rankingScreen').classList.remove('hidden');
            const scores = JSON.parse(localStorage.getItem('snakeScores_80y90') || '[]');
            const rankingList = document.getElementById('rankingList');
            if (scores.length === 0) { rankingList.innerHTML = '<p>&#xA1;Sin r&#xE9;cords!</p>'; } 
            else { scores.sort((a, b) => b.score - a.score); rankingList.innerHTML = scores.slice(0, 10).map((s, i) => `${i + 1}. ${s.score} pts`).join('<br>'); }
        }

        function saveScore(newScore) {
            if (newScore === 0) return;
            const scores = JSON.parse(localStorage.getItem('snakeScores_80y90') || '[]');
            const now = new Date(); const dateStr = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`;
            scores.push({ score: newScore, date: dateStr }); localStorage.setItem('snakeScores_80y90', JSON.stringify(scores));
        }

        function updateScore() { }

        function shareScore() {
            playSound('ui');
            const text = `¡Jugué a Snake en un Nokia y conseguí ${score} puntos! \uD83D\uDCF1`;
            if (navigator.share) { navigator.share({ title: 'Nokia Snake', text: text, url: window.location.href }); } 
            else { navigator.clipboard.writeText(text + ' ' + window.location.href); alert('¡Texto copiado!'); }
        }

        function handleKey(key) {
            if (key === 'c' || key === 'C') { showMenu(); return; }
            const inMenu = !document.getElementById('menuScreen').classList.contains('hidden');
            const inGameOver = !document.getElementById('gameOverScreen').classList.contains('hidden');
            const inRanking = !document.getElementById('rankingScreen').classList.contains('hidden');
            if (inMenu || inGameOver || inRanking) { if (key === '5') startGame(); return; }
            switch(key) {
                case '2': if (dy !== 1) { dx = 0; dy = -1; } break;
                case '8': if (dy !== -1) { dx = 0; dy = 1; } break;
                case '4': if (dx !== 1) { dx = -1; dy = 0; } break;
                case '6': if (dx !== -1) { dx = 1; dy = 0; } break;
                case '5': if (gameLoop) { clearInterval(gameLoop); gameLoop = null; } else { gameLoop = setInterval(gameStep, gameSpeed); } break;
            }
        }

        document.addEventListener('keydown', (e) => {
            const keyMap = { 'ArrowUp': '2', 'w': '2', 'W': '2', 'ArrowDown': '8', 's': '8', 'S': '8', 'ArrowLeft': '4', 'a': '4', 'A': '4', 'ArrowRight': '6', 'd': '6', 'D': '6', ' ': '5', 'Enter': '5', 'Escape': 'c', 'c': 'c', 'C': 'c' };
            if (keyMap[e.key]) { e.preventDefault(); handleKey(keyMap[e.key]); }
        });

        showMenu();
    </script>
</body>
</html>
